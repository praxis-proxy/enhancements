name: Proposal Validation

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: proposal-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  proposal-check:
    if: >-
      ${{
        !github.event.pull_request.draft &&
        !contains(github.event.pull_request.labels.*.name, 'skip/proposals')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PRAXIS_BOT_APP_ID }}
          private-key: ${{ secrets.PRAXIS_BOT_APP_PRIVATE_KEY }}

      - name: Validate proposal files
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          VALID_REPOS="praxis ai operator extproc conventions experiments grid forge policy demos pingora"
          VALID_STATUSES="proposed blocked deferred accepted experimental released withdrawn retroactive"

          proposal_files=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --paginate \
            --jq '[.[] | select(.filename | startswith("proposals/")) | select(.filename | endswith(".md")) | select(.filename != "proposals/template.md")]')

          count=$(echo "$proposal_files" | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "No proposal files in this PR -- skipping"
            exit 0
          fi

          errors=""

          while IFS= read -r file; do
            status=$(echo "$proposal_files" | jq -r --arg f "$file" '.[] | select(.filename == $f) | .status')

            if [ "$status" = "removed" ]; then
              continue
            fi

            # Proposal assets inherit their parent's lifecycle and metadata.
            # Keep them beside the proposal as <stem>.asset-<name>.md.
            if [[ "$file" =~ ^(proposals/[0-9]+_[a-zA-Z0-9_-]+)\.asset-[a-zA-Z0-9_-]+\.md$ ]]; then
              parent_file="${BASH_REMATCH[1]}.md"
              if ! parent_type=$(gh api "repos/${{ github.repository }}/contents/${parent_file}?ref=$HEAD_SHA" \
                --jq '.type' 2>/dev/null) || [ "$parent_type" != "file" ]; then
                errors="${errors}\n- \`${file}\`: proposal asset requires parent proposal \`${parent_file}\` at the PR head"
              fi
              continue
            fi

            content=$(gh api "repos/${{ github.repository }}/contents/${file}?ref=$HEAD_SHA" \
              --jq '.content' | base64 -d)

            frontmatter=$(echo "$content" | sed -n '/^---$/,/^---$/p' | sed '1d;$d')

            # --- issue (the originating issue this proposal came from) ---
            issue=$(echo "$frontmatter" | grep -E '^issue:' | sed 's/^issue:[[:space:]]*//')
            if [ -z "$issue" ] || echo "$issue" | grep -qE '^#'; then
              has_origin=$(echo "$frontmatter" | grep -E '^origin:')
              if [ -z "$has_origin" ]; then
                errors="${errors}\n- \`${file}\`: missing \`issue\` field in frontmatter"
              fi
            fi

            # --- authors ---
            authors_section=$(echo "$frontmatter" | sed -n '/^authors:/,/^[a-z]/p' | grep -E '^  - ' | head -1)
            if [ -z "$authors_section" ]; then
              errors="${errors}\n- \`${file}\`: missing or empty \`authors\` list in frontmatter"
            fi

            # --- stakeholders ---
            stakeholders_section=$(echo "$frontmatter" | sed -n '/^stakeholders:/,/^[a-z]/p' | grep -E '^  - ' | head -1)
            if [ -z "$stakeholders_section" ]; then
              errors="${errors}\n- \`${file}\`: missing or empty \`stakeholders\` list in frontmatter"
            fi

            # --- repos ---
            repos_section=$(echo "$frontmatter" | sed -n '/^repos:/,/^[a-z]/p' | grep -E '^  - ' | head -1)
            if [ -z "$repos_section" ]; then
              errors="${errors}\n- \`${file}\`: missing or empty \`repos\` list in frontmatter"
            else
              while IFS= read -r repo_val; do
                repo_val=$(echo "$repo_val" | sed 's/^  - //' | tr -d '[:space:]')
                if [ -n "$repo_val" ] && ! echo "$VALID_REPOS" | grep -qw "$repo_val"; then
                  errors="${errors}\n- \`${file}\`: invalid repo value \`${repo_val}\` (valid: ${VALID_REPOS})"
                fi
              done < <(echo "$frontmatter" | sed -n '/^repos:/,/^[a-z]/p' | grep -E '^  - ')
            fi

            # --- status ---
            file_status=$(echo "$frontmatter" | grep -E '^status:' | sed 's/^status:[[:space:]]*//')
            if [ -n "$file_status" ] && ! echo "$VALID_STATUSES" | grep -qw "$file_status"; then
              errors="${errors}\n- \`${file}\`: invalid status \`${file_status}\` (valid: ${VALID_STATUSES})"
            fi

            # --- experimental_exempt requires reason ---
            exempt=$(echo "$frontmatter" | grep -E '^experimental_exempt:' | sed 's/^experimental_exempt:[[:space:]]*//')
            if [ "$exempt" = "true" ]; then
              reason=$(echo "$frontmatter" | grep -E '^experimental_exempt_reason:' | sed 's/^experimental_exempt_reason:[[:space:]]*//' | tr -d '"')
              if [ -z "$reason" ]; then
                errors="${errors}\n- \`${file}\`: \`experimental_exempt: true\` requires a non-empty \`experimental_exempt_reason\`"
              fi
            fi

            # --- new proposals must not include How? ---
            if [ "$status" = "added" ]; then
              proposal_name=$(basename "$file" .md | sed 's/^[0-9][0-9]*_//')
              renamed_from=$(echo "$proposal_files" | jq -r --arg b "$proposal_name" \
                '[.[] | select(.status == "removed") | select(.filename | endswith($b + ".md"))] | length')
              # A substantial rewrite can appear as added + removed even
              # when it also renames the slug. Verify the proposal number
              # and originating issue against the deleted file at the base.
              if [ "$renamed_from" -eq 0 ] && [ -n "$issue" ]; then
                proposal_number=$(basename "$file" | cut -d_ -f1)
                while IFS= read -r previous_file; do
                  previous_number=$(basename "$previous_file" | cut -d_ -f1)
                  if [ "$previous_number" != "$proposal_number" ]; then
                    continue
                  fi
                  previous_content=$(gh api "repos/${{ github.repository }}/contents/${previous_file}?ref=$BASE_SHA" \
                    --jq '.content' | base64 -d)
                  previous_issue=$(echo "$previous_content" | sed -n '/^---$/,/^---$/p' \
                    | sed '1d;$d' | grep -E '^issue:' | sed 's/^issue:[[:space:]]*//')
                  if [ "$previous_issue" = "$issue" ]; then
                    renamed_from=1
                    break
                  fi
                done < <(echo "$proposal_files" | jq -r '.[] | select(.status == "removed") | .filename')
              fi
              if [ "$renamed_from" -eq 0 ]; then
                if echo "$content" | grep -qF '## How?'; then
                  errors="${errors}\n- \`${file}\`: new proposals must not include the \`## How?\` section in the first PR. Submit What? and Why? first; add How? in a follow-up."
                fi
              fi
            fi
          done < <(echo "$proposal_files" | jq -r '.[].filename')

          if [ -n "$errors" ]; then
            marker="<!-- enhancements:proposal-check -->"
            already=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              --jq "[.[] | select(.body | contains(\"${marker}\"))] | length")

            if [ "$already" -eq 0 ]; then
              gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
                --body "${marker}
          **Proposal validation failed**:
          $(echo -e "$errors")

          See [proposal process](docs/process.md) for requirements."
            fi
            echo "::error::Proposal validation failed"
            exit 1
          fi
